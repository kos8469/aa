<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>동물 친구 AI 대화</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>동물 친구 AI 대화</h1>
        <p>아이들이 친숙하게 느끼도록 동물 친구와 대화해요.</p>
      </header>

      <section class="app__controls">
        <label for="animal-select">동물 친구 선택</label>
        <select id="animal-select" aria-label="동물 친구 선택">
          <option value="fox">여우 루루</option>
          <option value="rabbit">토끼 모모</option>
          <option value="bear">곰 토토</option>
          <option value="penguin">펭귄 피요</option>
          <option value="cat">고양이 나비</option>
        </select>
      </section>

      <section class="chat" aria-live="polite">
        <div class="chat__messages" id="messages"></div>
        <form class="chat__input" id="chat-form">
          <label class="sr-only" for="chat-text">대화 입력</label>
          <input
            id="chat-text"
            name="chat-text"
            type="text"
            placeholder="오늘 기분이 어때요?"
            autocomplete="off"
            required
          />
          <button type="submit">보내기</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
